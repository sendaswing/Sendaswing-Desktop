appId: com.sendaswing.desktop
productName: Sendaswing Desktop
copyright: Copyright © 2026

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  # ffprobe-static ships binaries for every platform; only keep this one's
  - '!node_modules/ffprobe-static/bin/darwin/**'
  - '!node_modules/ffprobe-static/bin/linux/**'

# ffmpeg/ffprobe must be real files on disk, not inside app.asar, to be spawned
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/ffprobe-static/**

mac:
  category: public.app-category.sports
  target:
    - target: dmg
      arch: [x64, arm64]

win:
  target:
    - target: nsis
      arch: [x64]

linux:
  target:
    - target: AppImage
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
